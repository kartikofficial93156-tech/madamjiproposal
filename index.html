<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5eafa">
<title>For Madam Ji 💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--ink:#4d315d;--muted:#826b8e;--purple:#9b72c8;--pink:#f3a9c9;--cream:#fffaff;--line:rgba(255,255,255,.76)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink)}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 10% 15%,#ffe4f0 0,transparent 36%),radial-gradient(ellipse at 88% 12%,#e7d8ff 0,transparent 38%),radial-gradient(ellipse at 50% 100%,#f9dff0 0,transparent 40%),linear-gradient(135deg,#fffaff,#f2e9ff 52%,#fff0f5)}
button,input,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.twinkle{position:absolute;color:#fff;font-size:clamp(10px,2vw,22px);animation:twinkle 3s ease-in-out infinite}
.floaty{position:absolute;bottom:-50px;opacity:0;animation:floatUp linear infinite;filter:drop-shadow(0 4px 9px #d89ec655)}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.18)}}
@keyframes floatUp{0%{transform:translateY(0) rotate(-10deg);opacity:0}10%{opacity:.6}90%{opacity:.45}100%{transform:translateY(-115vh) rotate(30deg);opacity:0}}
main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:min(100%,610px);min-height:440px;padding:clamp(25px,6vw,52px);position:relative;text-align:center;border:1px solid var(--line);border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,248,255,.58));box-shadow:0 24px 80px rgba(110,72,143,.14),inset 0 1px 0 #fff;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.card:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#f6c9e6aa,transparent 70%);top:-125px;right:-65px;pointer-events:none}
.page{width:100%;animation:enter .55s cubic-bezier(.2,.75,.25,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.eyebrow{font-size:.73rem;text-transform:uppercase;letter-spacing:.2em;font-weight:700;color:#a17bb5;margin:0 0 15px}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;line-height:1.14;letter-spacing:-.025em;margin:0 0 18px}
h1{font-size:clamp(2.15rem,7vw,3.7rem)}h2{font-size:clamp(1.9rem,6vw,2.8rem)}
p{font-size:clamp(1rem,2.7vw,1.1rem);line-height:1.85;color:#735d80;margin:0 auto 24px;max-width:470px}
.sub{font-size:.9rem;color:#a28bac;margin-top:14px}
.btn{border:0;border-radius:999px;padding:14px 23px;font-weight:700;transition:transform .2s,box-shadow .2s,background .2s;box-shadow:0 9px 22px #9a6cc52b}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.98)}
.primary{background:linear-gradient(110deg,#a77bd0,#e79bc6);color:white;box-shadow:0 10px 26px #b37bcb55}
.secondary{background:#fff8ff;color:#8969a0;border:1px solid #ead9f4;box-shadow:none}
.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;align-items:center}
.hero-art{height:155px;width:190px;display:grid;place-items:center;position:relative;margin:0 auto 14px}
.envelope{position:relative;width:120px;height:80px;background:linear-gradient(145deg,#eeb4d5,#b99ae8);border-radius:12px;box-shadow:0 16px 28px #ad7fbe40;animation:bob 3s ease-in-out infinite}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49%,#f9d9ed 50%);clip-path:polygon(0 0,100% 0,50% 58%);border-radius:12px 12px 0 0}
.envelope:after{content:"";position:absolute;inset:0;background:linear-gradient(35deg,#e5a6ce,#f7d7e9);clip-path:polygon(0 100%,0 45%,50% 80%,100% 45%,100% 100%);border-radius:0 0 12px 12px}
.seal{position:absolute;z-index:2;left:50%;top:48%;transform:translate(-50%,-50%);font-size:29px;filter:drop-shadow(0 3px 2px #b775a0)}
.orbit{position:absolute;color:#d99bc7;font-size:24px;animation:orbit 5s linear infinite}.o1{left:10px;top:20px}.o2{right:9px;top:30px;animation-delay:-2s}.o3{left:32px;bottom:0;font-size:17px}
@keyframes bob{50%{transform:translateY(-8px) rotate(1deg)}}@keyframes orbit{50%{transform:translateY(-10px) rotate(12deg)}}
.progress{display:flex;gap:6px;justify-content:center;margin-bottom:24px}.dot{height:5px;width:22px;border-radius:9px;background:#e8d9f0}.dot.active{width:34px;background:linear-gradient(90deg,#ad83d2,#eda6cb)}
.proposal-copy{margin-bottom:24px}
.choice-area{position:relative;width:100%;min-height:130px;display:flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap;margin-top:6px}
#yesBtn{position:relative;z-index:2;white-space:nowrap;transform-origin:center;min-width:138px}
#thinkBtn{position:relative;z-index:3;white-space:nowrap}
.tease{min-height:46px;margin:16px auto 0!important;color:#9b6da9;font-weight:600;font-size:.95rem;max-width:400px}
.fields{width:100%;max-width:440px;text-align:left;display:grid;gap:13px;margin:4px auto 18px}
label{display:grid;gap:6px;color:#876a98;font-size:.84rem;font-weight:700}
input,textarea{width:100%;padding:12px 14px;border:1px solid #e6d4ef;border-radius:14px;background:#fffaffd9;color:#563d65;outline:none;transition:border .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:#c39add;box-shadow:0 0 0 3px #d9b9ec45}
textarea{resize:vertical;min-height:74px}
.celebrate{font-size:2.4rem;margin-bottom:10px;animation:pop .7s ease both}
@keyframes pop{0%{transform:scale(.3) rotate(-15deg);opacity:0}75%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.note{font-size:.88rem!important;line-height:1.65!important;background:#fff7fc;border:1px dashed #e8c7e2;border-radius:16px;padding:13px 16px}
.footer{font-size:.75rem;color:#b09abb;margin-top:23px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#60436f;color:white;padding:12px 18px;border-radius:99px;box-shadow:0 8px 25px #51305d44;opacity:0;pointer-events:none;transition:.3s;z-index:10;max-width:90vw;text-align:center;font-size:.9rem}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;z-index:5;top:-20px;width:9px;height:13px;pointer-events:none;animation:fall 3.6s linear forwards}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(760deg);opacity:.2}}
.confirmed{border-radius:18px;background:#fff7fc;padding:16px;margin-top:12px;animation:enter .5s ease both}
.confirmed h2{font-size:1.8rem}
@media(max-width:430px){main{padding:14px 11px}.card{min-height:490px;padding:27px 20px;border-radius:27px}.choice-area{gap:9px;min-height:145px}.btn{padding:13px 18px}.hero-art{height:135px}.footer{margin-top:17px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<main>
<section class="card" aria-live="polite">
<div class="page" id="page"></div>
<div class="footer">a tiny little corner of the internet, just for you 💌</div>
</section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
const pageEl = document.getElementById('page');
const sky = document.getElementById('sky');
const toast = document.getElementById('toast');
let page = 0, thinkCount = 0, yesScale = 1, toastTimer, confettiTimer;
const teaseMessages = [
"Come onnn, I made you a whole website 😭💗",
"Imagine the cute pictures we’d take together 🥹📸",
"I’ll let you choose the snacks. Serious offer. 🍫",
"One date, good conversations, maybe some food? 🫶🏻",
"Madam Ji, reconsider your decision 🤨💗"
];
function setupSky(){
  const symbols = ['✦','✧','♡','✦','·','✧'];
  for(let i=0;i<24;i++){
    const s=document.createElement('span');s.className='twinkle';s.textContent=symbols[i%symbols.length];
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*4)+'s';s.style.animationDuration=(2+Math.random()*3)+'s';sky.appendChild(s);
  }
  for(let i=0;i<11;i++){
    const h=document.createElement('span');h.className='floaty';h.textContent=['♡','💗','✧','💕'][i%4];
    h.style.left=Math.random()*100+'%';h.style.animationDuration=(13+Math.random()*15)+'s';h.style.animationDelay=(-Math.random()*24)+'s';h.style.fontSize=(14+Math.random()*17)+'px';sky.appendChild(h);
  }
}
function progress(n){return `<div class="progress" aria-label="Step ${n} of 5">${[1,2,3,4,5].map(i=>`<span class="dot ${i<=n?'active':''}"></span>`).join('')}</div>`}
function render(n){
 page=n;
 if(n===0){pageEl.innerHTML=`<div class="page">${`<p class="eyebrow">a little something for you</p>`}<div class="hero-art" aria-hidden="true"><span class="orbit o1">✦</span><span class="orbit o2">♡</span><span class="orbit o3">✧</span><div class="envelope"><span class="seal">💗</span></div></div><h1>Hey, Madam Ji 🥰😝</h1><p>I have a tiny thing to tell you… and I made it extra cute.</p><button class="btn primary" id="openBtn">Open this, Madam Ji 💗</button><div class="sub">psst… this is just between us 🤫</div></div>`;}
 if(n===1){pageEl.innerHTML=`${progress(2)}<p class="eyebrow">page one · a little confession</p><h2>Can I tell you something?</h2><p>“I’ve been wanting to tell you something for a little while. There’s just something about you that makes me smile a little more than usual. So I made this little corner of the internet just for you. No pressure, no perfect words — just something genuine. 💌”</p><button class="btn primary" id="nextBtn">Next, Madam Ji 🌷 →</button>`;}
 if(n===2){pageEl.innerHTML=`${progress(3)}<p class="eyebrow">page two · the honest bit</p><div class="hero-art" style="height:90px;font-size:55px" aria-hidden="true">🌷💞</div><h2>You make my day better</h2><p>“Talking to you has become one of my favourite parts of the day. Even an ordinary conversation can make a day feel a little nicer. And well… I have a tiny question for you. 👀💗”</p><button class="btn primary" id="nextBtn">Okay… tell me 👀 →</button>`;}
 if(n===3){pageEl.innerHTML=`${progress(4)}<p class="eyebrow">the tiny question 💌</p><div class="hero-art" style="height:82px;font-size:54px" aria-hidden="true">🥹💐</div><h2>So, Madam Ji… 🥹💗</h2><p class="proposal-copy">Would you like to go on a date with me? 🌷</p><div class="choice-area" id="choiceArea"><button class="btn primary" id="yesBtn">YESSS! 💗</button><button class="btn secondary" id="thinkBtn">Let me think 🤭</button></div><p class="tease" id="tease" aria-live="polite"></p><p class="sub">Your answer is yours to choose. 💗</p>`;yesScale=1;thinkCount=0;positionThinkButton(false);}
 if(n===4){pageEl.innerHTML=`${progress(5)}<div class="celebrate" aria-hidden="true">💗🎉🌷</div><p class="eyebrow">a new little adventure</p><h2>WAIT, SHE SAID YES?! 😭💗</h2><p>Okay, Madam Ji… now comes the important part: <strong>OUR DATE! 🫶🏻</strong></p><form id="dateForm"><div class="fields"><label>Date<input type="date" id="dateField" name="date"></label><label>Time<input type="time" id="timeField" name="time"></label><label>Place<input type="text" id="placeField" name="place" placeholder="Somewhere you’d like to go…"></label><label>Plan<textarea id="planField" name="plan" placeholder="Food, a walk, coffee, anything you fancy…"></textarea></label></div><p class="note">No pressure to make everything perfect. I just want us to have a nice time together. 💌</p><button class="btn primary" type="submit">Plan our little date 💞</button></form><div id="confirmation" hidden></div>`;startConfetti(110);}
 if(n===5){/* reserved */}
 pageEl.querySelectorAll('button').forEach(b=>{if(b.id==='openBtn')b.addEventListener('click',()=>render(1));if(b.id==='nextBtn')b.addEventListener('click',()=>render(page+1));});
 if(n===3){document.getElementById('yesBtn').addEventListener('click',()=>{burstConfetti(90);render(4);window.scrollTo({top:0,behavior:'smooth'});});document.getElementById('thinkBtn').addEventListener('click',onThink); }
 if(n===4){document.getElementById('dateForm').addEventListener('submit',confirmDate);}
}
function positionThinkButton(move){
 const btn=document.getElementById('thinkBtn'), area=document.getElementById('choiceArea');
 if(!btn||!area)return;
 if(!move){btn.style.position='relative';btn.style.left='';btn.style.top='';return;}
 // Reposition only inside the visible choice area, with measured bounds.
 btn.style.position='absolute';
 const aw=area.clientWidth, ah=area.clientHeight, bw=btn.offsetWidth, bh=btn.offsetHeight;
 const maxX=Math.max(0,aw-bw), maxY=Math.max(0,ah-bh);
 let x=Math.random()*maxX, y=Math.random()*maxY;
 // Keep the button away from the yes button's central click zone where possible.
 btn.style.left=x+'px';btn.style.top=y+'px';
}
function onThink(){
 thinkCount++;
 document.getElementById('tease').textContent=teaseMessages[(thinkCount-1)%teaseMessages.length];
 const yes=document.getElementById('yesBtn');
 yesScale=Math.min(1.38,yesScale+0.075);
 yes.style.transform=`scale(${yesScale})`;
 // Keep the YES button clickable and within the card by reserving space and changing the teasing button's position.
 positionThinkButton(true);
}
function startConfetti(count){burstConfetti(count);if(confettiTimer)clearInterval(confettiTimer);confettiTimer=setInterval(()=>burstConfetti(14),900);}
function burstConfetti(count){
 const colors=['#e99bc5','#b99be8','#f8c9df','#d8c5f3','#fff','#d99aaf'];
 for(let i=0;i<count;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.borderRadius=Math.random()>.5?'50%':'2px';c.style.setProperty('--drift',(Math.random()*240-120)+'px');c.style.animationDuration=(2.5+Math.random()*2.2)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5000);}
}
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),3600);}
function confirmDate(e){
 e.preventDefault();
 const date=document.getElementById('dateField').value;
 const time=document.getElementById('timeField').value;
 const place=document.getElementById('placeField').value.trim();
 const plan=document.getElementById('planField').value.trim();
 const parts=[];if(date)parts.push('Date: '+date);if(time)parts.push('Time: '+time);if(place)parts.push('Place: '+place);if(plan)parts.push('Plan: '+plan);
 const box=document.getElementById('confirmation');
 box.hidden=false;
 box.className='confirmed';
 box.innerHTML=`<div style="font-size:2rem">💌✨</div><h2>It’s a date! 💗</h2><p>${parts.length?escapeHtml(parts.join(' · ')):'The details are still a surprise — we’ll figure them out together!'} </p><p style="font-size:.9rem;margin-bottom:0">This plan is saved in this page for now. Send the details to each other so you both have them. 🫶🏻</p>`;
 burstConfetti(80);showToast('Date plan confirmed in this page 💗');
 box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
setupSky();render(0);
})();
</script>
</body>
</html>
